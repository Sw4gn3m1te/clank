[project]
name = "clank-server"
version = "0.1.0"
description = "Prover server for the clank Lean 4 tactic"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
clank-server = "clank_server.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["clank_server*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
